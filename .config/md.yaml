# Active style. Choose one of the style blocks below.
style: md-light
# 0 follows the terminal width; a positive value overrides it.
width: 0
# 0 follows the available width; a positive value centers a narrower column.
# This is the Markdown content width, excluding style margins.
max_line_length: 100
# Translate supported LaTeX math to terminal Unicode.
render_latex: true
# "builtin" uses md's pager; external commands (e.g. less -R) also work.
# $PAGER overrides this value when set.
pager: builtin

styles:
  md-light:
    normal_fg: 234
    heading_fg: 27
    h1_fg: 228
    h1_bg: 63
    rule_fg: 249
    link_fg: 36
    link_text_fg: 29
    inline_code_fg: 234
    inline_code_bg: 254
    search_selected_bg: 226 # yellow
    search_selected_fg: 0 # black
    search_other_bg: 0 # black
    search_other_fg: 15 # white
    margin_left: 1
    margin_right: 1
  glow-light:
    normal_fg: 234
    heading_fg: 27
    h1_fg: 228
    h1_bg: 63
