name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Test and build
        run: |
          cargo test --locked
          cargo build --release --locked

      - name: Smoke test
        shell: bash
        run: |
          set -eu
          target/release/md --version
          PAGER=cat target/release/md README.md >/dev/null
          printf '# Heading\n\nMarkdown from stdin.\n' | PAGER=cat target/release/md - >/dev/null

      - name: Package
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          target="md-${VERSION}-${TARGET}"
          mkdir -p "dist/${target}/bin" "dist/${target}/share/md/tools" "dist/${target}/share/md/vendor/pi-tui"
          install -m 755 target/release/md "dist/${target}/bin/md"
          install -m 644 tools/pi-math.mjs "dist/${target}/share/md/tools/pi-math.mjs"
          install -m 644 vendor/pi-tui/latex.js "dist/${target}/share/md/vendor/pi-tui/latex.js"
          install -m 644 vendor/pi-tui/NOTICE "dist/${target}/share/md/vendor/pi-tui/NOTICE"
          install -m 644 .config/md.yaml "dist/${target}/share/md/md.yaml"
          tar -C dist -czf "dist/${target}.tar.gz" "${target}"
          (cd dist && if command -v sha256sum >/dev/null; then sha256sum "${target}.tar.gz"; else shasum -a 256 "${target}.tar.gz"; fi) > "dist/${target}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: md-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: md-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
